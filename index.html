<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UPM · Dashboard Penetapan Awal SDG (Semua PTJ)</title>
<style>

:root{--g:#0B5D3B;--g2:#094a30;--gold:#F2B705;--bg:#f4f7f5;--card:#fff;--tx:#15261e;--mut:#5b6b63;--bd:#dbe5df;--row:#f0f6f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#16221c;--tx:#e8f0ec;--mut:#9fb2a8;--bd:#2a3b32;--row:#1b2a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1612;--card:#16221c;--tx:#e8f0ec;--mut:#9fb2a8;--bd:#2a3b32;--row:#1b2a22;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:22px 20px;border-bottom:5px solid var(--gold)}
.wrap{max-width:1200px;margin:0 auto}
header small{letter-spacing:.12em;font-weight:700;color:var(--gold);font-size:12px}
header h1{margin:4px 0 4px;font-size:clamp(20px,3.2vw,30px)}
header p{margin:0;opacity:.85;font-size:13px}
main{padding:20px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--gold);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:30px;color:var(--g)}
@media (prefers-color-scheme:dark){.kpi b{color:var(--gold)}}
.kpi span{font-size:12px;color:var(--mut)}
h2{font-size:17px;margin:26px 0 4px;color:var(--g);border-bottom:2px solid var(--gold);padding-bottom:6px;display:inline-block}
@media (prefers-color-scheme:dark){h2{color:var(--gold)}}
.hint{font-size:12px;color:var(--mut);margin:4px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{border:0;border-radius:6px;color:#fff;padding:8px 9px 9px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;font-family:inherit;transition:transform .12s,box-shadow .12s;outline-offset:2px}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.tile.on{outline:3px solid var(--gold);box-shadow:0 0 0 2px var(--g2)}
.tile{padding:0;min-height:0;overflow:hidden}.tile img{width:100%;display:block}.tile .tc{padding:0 7px 8px}.tile .n{font-size:30px;font-weight:800;line-height:1}
.tile .t{font-size:10.5px;font-weight:700;text-transform:uppercase;line-height:1.15;margin-top:4px;flex:1}
.tile .c{font-size:11px;background:rgba(0,0,0,.22);border-radius:4px;padding:3px 6px;margin-top:6px;display:flex;justify-content:space-between}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.3);margin-top:5px}
.bar i{display:block;background:#fff}.bar i+i{background:rgba(255,255,255,.55)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px}
button.reset{padding:9px 14px;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{background:var(--g);color:#fff;text-align:left;padding:10px;position:sticky;top:0}
td{padding:9px 10px;border-top:1px solid var(--bd);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 6px;border-radius:5px;font-weight:700;font-size:12px;margin:1px 3px 1px 0;color:#fff;border:2px solid transparent}
.chip.s{background:transparent!important;color:var(--tx);border-color:currentColor}
.chip.dim{opacity:.18}
tr.hide{display:none}
.matrix td,.matrix th{padding:4px;text-align:center;font-size:11px}
.matrix td:first-child,.matrix th:first-child{text-align:left;min-width:230px;padding:6px 10px;position:sticky;left:0;background:inherit;z-index:1}
.matrix th:first-child{background:var(--g)}
.matrix tbody tr:nth-child(odd) td:first-child{background:var(--card)}.matrix tbody tr:nth-child(even) td:first-child{background:var(--row)}
.cell{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:4px;font-weight:700;color:#fff;font-size:11px}
.cell.s{background:transparent!important;border:2px solid;line-height:20px}
.leg{font-size:12px;color:var(--mut);display:flex;gap:16px;align-items:center;margin:8px 0;flex-wrap:wrap}
footer{font-size:12px;color:var(--mut);margin-top:28px;padding-top:12px;border-top:1px solid var(--bd)}

.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--g2);padding:8px 10px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tab{border:0;background:rgba(255,255,255,.1);color:#fff;padding:9px 14px;border-radius:8px 8px 0 0;font-weight:600;font-size:13px;font-family:inherit;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--bg);color:var(--g)}
@media (prefers-color-scheme:dark){.tab.on{color:var(--gold)}}
#st{font-size:12px;padding:6px 16px;background:var(--row);border-bottom:1px solid var(--bd);color:var(--mut)}
.box{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:13px;margin:12px 0}
.box ol{margin:6px 0 0;padding-left:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;text-align:left;font-family:inherit;color:var(--tx)}
.sc:hover{border-color:var(--g)}.sc b{font-size:15px}.sc small{display:block;color:var(--mut);margin:2px 0 8px}
.pb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bd)}.pb i{display:block}
.bd{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.bd.pending{background:#e6e9e7;color:#4a5750}.bd.confirmed{background:#d5f0df;color:#0b5d3b}.bd.changed{background:#fde9a8;color:#6b4e00}
.ab{padding:6px 10px;border:1px solid var(--g);background:transparent;color:var(--g);border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;margin-right:4px;font-family:inherit}
@media (prefers-color-scheme:dark){.ab{color:var(--gold);border-color:var(--gold)}}
.ab:hover{background:var(--g);color:#fff}
.ed{font-size:10px;background:var(--gold);color:#222;border-radius:4px;padding:1px 5px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.md{background:var(--card);color:var(--tx);border-radius:12px;max-width:720px;width:100%;padding:18px;border-top:5px solid var(--gold)}
.md h3{margin:0 0 4px;color:var(--g)}.md label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
.md input,.md textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}
.mt{position:relative;border:3px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;overflow:hidden}
.mt img{width:100%;display:block}.mt.off img{opacity:.35}
.mt b{position:absolute;top:3px;right:3px;background:#000;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:11px}
.mt.p{border-color:var(--gold)}.mt.s{border-color:#fff;box-shadow:0 0 0 2px var(--g)}
.msg{font-size:12px;margin:8px 0;color:#b3261e;min-height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row .reset.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#tt{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:92vw;display:none}
#tt input{width:min(80vw,520px);margin-top:6px}
.dt td,.dt th{padding:6px 8px;font-size:12px}.dt small{color:var(--mut)}
.h2b{margin-top:30px}

/* === Paparan pembentangan === */
.kpis{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kpi{padding:18px 20px}.kpi b{font-size:52px;line-height:1.1}.kpi span{font-size:17px;font-weight:600}
h2{font-size:26px}.hint{font-size:15px}
.cards{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sc{padding:18px}.sc b{font-size:24px}.sc small{font-size:18px;margin:6px 0 14px;line-height:1.6;color:var(--tx)}
.sc .bn{font-size:30px;font-weight:800;color:var(--g)}
@media (prefers-color-scheme:dark){.sc .bn{color:var(--gold)}}
.pb{height:16px;border-radius:8px}
.tiles{grid-template-columns:repeat(auto-fill,106px);gap:12px}
.tile .tc{padding:0 6px 8px}.tile .bar{height:8px}
.tile .c{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center;padding:4px 2px;font-size:22px;font-weight:800;line-height:1.1;margin-top:6px}
.tile .c em{display:block;font-style:normal;font-size:12px;font-weight:700;opacity:.95}
table{font-size:16px;min-width:880px}th{font-size:16px;padding:14px 12px}td{padding:12px}
.chip{min-width:36px;height:34px;font-size:16px;margin:2px 4px 2px 0}
.bd{font-size:14px;padding:5px 11px}.ab{font-size:14px;padding:8px 12px}.ed{font-size:12px}
.dt td,.dt th{font-size:16px;padding:10px 12px}.dt small{font-size:15px}.dt td b{font-size:20px}
.matrix td,.matrix th{font-size:14px;padding:5px}.cell{width:32px;height:32px;line-height:32px;font-size:14px}.cell.s{line-height:28px}
.matrix td:first-child,.matrix th:first-child{min-width:300px;font-size:15px}
input[type=search]{font-size:17px;padding:12px 14px}button.reset{font-size:16px;padding:12px 18px}
.leg{font-size:15px}.tab{font-size:15px;padding:11px 16px}#st{font-size:14px}.box{font-size:16px}
.tools .hint{font-size:16px;font-weight:600}
#tb td:nth-child(3),#tb td:nth-child(4){white-space:nowrap}table{min-width:1000px}

function openM(e){const x=all().find(a=>a.id===e);if(!x)return;M={x,sel:{},by:(x.e&&x.e.by)||"",note:"",msg:"",kod:(function(){try{return localStorage.getItem("sdgkod")||""}catch(e){return""}})()};x.p.forEach(n=>M.sel[n]="p");x.s.forEach(n=>M.sel[n]="s");arm=false;drawM()}
function setsEq(a,b){return a.length===b.length&&a.every(n=>b.includes(n))}
function selArr(t){return Object.keys(M.sel).filter(n=>M.sel[n]===t).map(Number).sort((a,b)=>a-b)}
function drawM(){const x=M.x,ro=!(db&&canW);
$("md").innerHTML=`<div class="ov" id="ovl"><div class="md"><h3>${esc(x.name)}</h3><small style="color:var(--mut)">${esc(secOf(x.k).tab)} · status: <span class="bd ${x.st}">${LBL[x.st]}</span></small>
<p style="font-size:12px;margin:8px 0 2px"><b>Tetapan asal (dokumen):</b> Primary ${x.bp.map(n=>chip(n,1)).join("")} Supporting ${x.bs.map(n=>chip(n,0)).join("")}</p>
<p class="hint" style="margin:6px 0">${ro?"Mod baca sahaja.":"Klik logo: sekali = Primary (maks. 3), dua kali = Supporting, tiga kali = buang."}</p>
<div class="mg">${SDG.map((g,i)=>{const n=i+1,v=M.sel[n];return `<button class="mt ${v||""} ${v?"":"off"}" data-m="${n}" ${ro?"disabled":""} aria-label="SDG ${n}"><img src="${LOGO[i]}" alt="SDG ${n}">${v?`<b>${v.toUpperCase()}</b>`:""}</button>`}).join("")}</div>
<div style="font-size:13px">Primary: <b>${selArr("p").length}</b>/3 · Supporting: <b>${selArr("s").length}</b></div>
<label for="mby">Nama pegawai pengesah / jawatan</label><input id="mby" value="${esc(M.by)}" ${ro?"disabled":""}>
<label for="mnote">Justifikasi perubahan (wajib jika ada perubahan)</label><textarea id="mnote" rows="3" ${ro?"disabled":""}>${esc(M.note)}</textarea>
<label for="mkod">Kod akses PTJ</label><input id="mkod" type="password" autocomplete="off" value="${esc(M.kod)}" ${ro?"disabled":""}>
<div class="msg" id="mmsg">${esc(M.msg)}</div>
<div class="row">${ro?"":`<button class="reset" id="msave">Simpan &amp; Sahkan</button>${ov[x.id]?`<button class="reset alt" id="mdel">${arm?"Klik sekali lagi untuk padam":"Set semula ke asal"}</button>`:""}`}<button class="reset alt" id="mx">Tutup</button><button class="reset alt" data-l="${x.id}">🔗 Salin pautan</button></div></div></div>`}
function closeM(){M=null;$("md").innerHTML=""}
async function api(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});return r.json()}
async function save(){M.by=$("mby").value.trim();M.note=$("mnote").value.trim();M.kod=$("mkod").value.trim();const p=selArr("p"),s=selArr("s"),x=M.x,ch=!(setsEq(p,x.bp)&&setsEq(s,x.bs));
if(!p.length||p.length>3)M.msg="Pilih 1 hingga 3 SDG Primary.";else if(!M.by)M.msg="Sila isi nama pegawai pengesah.";else if(ch&&!M.note)M.msg="Sila nyatakan justifikasi perubahan.";else M.msg="";
if(M.msg){drawM();return}
const st=ch?"changed":"confirmed";$("msave").disabled=true;$("msave").textContent="Menyimpan…";
try{try{localStorage.setItem("sdgkod",M.kod)}catch(e){}
const r=await api({action:"save",id:x.id,k:x.k,name:x.name,status:st,p:ch?p:x.bp,s:ch?s:x.bs,by:M.by,note:M.note,kod:M.kod});if(!r.ok)throw r;ov[x.id]=r.row;closeM();render();toast("Disimpan: "+esc(LBL[st]))}catch(e){M.msg=(e&&e.error)||"Gagal menyimpan. Semak sambungan internet atau kod akses.";drawM()}}
async function delDoc(){if(!arm){arm=true;drawM();return}M.kod=$("mkod").value.trim();try{const r=await api({action:"delete",id:M.x.id,kod:M.kod});if(!r.ok)throw r;delete ov[M.x.id];closeM();render();toast("Dikembalikan kepada data asal")}catch(e){M.msg=(e&&e.error)||"Gagal memadam.";drawM()}}
async function exp(){const A=all(),R=[["Bahagian","No","Entiti","Primary asal","Supporting asal","Primary semasa","Supporting semasa","Status","Pegawai","Catatan","Tarikh kemaskini"]].concat(A.map(x=>[secOf(x.k).tab,x.i+1,x.name,x.bp.join(", "),x.bs.join(", "),x.p.join(", "),x.s.join(", "),LBL[x.st],x.e?x.e.by:"",x.e?x.e.note:"",x.e&&x.e.at?new Date(x.e.at).toISOString():""]));
const csv="\ufeff"+R.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
const bl=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="SDG_UPM_penetapan_awal.csv";document.body.appendChild(a);a.click();a.remove()}
document.addEventListener("click",e=>{const t=e.target.closest("button,.ov");if(!t)return;
if(t.classList.contains("tab")||t.classList.contains("goto"))return go(t.dataset.t);
if(t.id==="ovl"&&e.target===t)return closeM();
if(t.dataset.m&&M){const n=t.dataset.m,v=M.sel[n];M.by=$("mby").value;M.note=$("mnote").value;M.kod=$("mkod").value;
if(!v){if(selArr("p").length<3)M.sel[n]="p";else M.sel[n]="s"}else if(v==="p")M.sel[n]="s";else delete M.sel[n];M.msg="";return drawM()}
if(t.dataset.e)return openM(t.dataset.e);
if(t.dataset.l)return copy(t.dataset.l);
if(t.classList.contains("tile")&&$("tb")){const n=+t.dataset.n;sel=sel===n?null:n;return render()}
if(t.id==="mx")return closeM();if(t.id==="msave")return save();if(t.id==="mdel")return delDoc();if(t.id==="exp")return exp();
if(t.id==="rs"){sel=null;q="";return render()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;fill()}});
window.addEventListener("hashchange",route);
render();route();
async function load(){try{const r=await fetch(API+"?t="+Date.now()),j=await r.json();if(!j.ok)throw 0;ov={};j.rows.forEach(x=>{ov[x.id]=x});db=true;live=true}catch(e){if(!live)db=false}render()}
if(API.indexOf("http")===0){load();setInterval(()=>{if(!M)load()},30000)}
</script></body></html>
